services:
  open-webui:
    image: ghcr.io/open-webui/open-webui@sha256:e597ba2ca4425ff40f1f677930baae1278cc1e44cea399d5f588d5ce53611910
    restart: always
    networks:
      - traefik
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: "${LM_STUDIO_BASE_URL:?Set LM_STUDIO_BASE_URL in .env}"
      OPENAI_API_KEY: "${LM_STUDIO_API_KEY:-}"
    volumes:
      - open-webui:/app/backend/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.rule=Host(`${OPENWEBUI_DOMAIN}`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.open-webui.middlewares=secure-headers@file"
      - "traefik.http.routers.open-webui.service=open-webui@docker"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"

volumes:
  open-webui:
    driver: local
    driver_opts:
      type: none
      device: /mnt/SSD/Containers/openwebui
      o: bind

networks:
  traefik:
    external: true
