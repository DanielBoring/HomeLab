
services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:v2.17.1@sha256:3d7057b7e3b3e0be4b3ba34dd1b137b02a055f97ddc232c32817666658643842
    container_name: arcane
    restart: unless-stopped
    networks:
      - arcane-network
    ports:
      - 3552:3552
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
      - arcane-data:/app/data/projects
    environment:
      - APP_URL=${APP_URL:-http://localhost:3552}
      - PUID=${PUID:-3001}
      - PGID=${PGID:-3001}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_JSON=${LOG_JSON:-false}
      - POSTGRES_DB=${POSTGRES_DB:-arcane}
      - POSTGRES_USER=${POSTGRES_USER:-arcane}
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - postgres

  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: arcane-postgres
    restart: unless-stopped
    networks:
      - arcane-network
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-arcane}
      - POSTGRES_USER=${POSTGRES_USER:-arcane}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 stores PGDATA in /var/lib/postgresql/18/docker.
      # Existing PostgreSQL 17 data MUST be dumped/restored first; see README.
      - postgres-data:/var/lib/postgresql
    #ports:    # No port exposure needed - Arcane can access via arcane-network via postgres:5432
      #- 5432:5432

volumes:
  arcane-data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/SSD/Containers/arcane
      o: bind
  postgres-data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/SSD/Containers/arcane-postgres
      o: bind

networks:
  arcane-network:
    driver: bridge
