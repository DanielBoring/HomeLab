version: 2

updates:
  # GitHub Actions — keeps workflow dependencies up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker Compose — every top-level service directory's compose.yaml.
  # "docker-compose" (not "docker") is the ecosystem that reads compose files;
  # "docker" only reads Dockerfiles, which this repo doesn't have.
  # The glob picks up new service directories automatically — no entry to add.
  # Dependabot only opens PRs for pinned image tags (e.g. grafana:11.6.1).
  # Images using :latest or other floating tags are silently skipped (WUD
  # covers those), as are image refs built from ${VARIABLES}.
  - package-ecosystem: "docker-compose"
    directories:
      - "/*"
    schedule:
      interval: "weekly"
