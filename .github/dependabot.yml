version: 2

updates:
  # GitHub Actions — keeps workflow dependencies up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker — one entry per service directory that has a compose.yaml.
  # Dependabot only opens PRs for pinned image tags (e.g. grafana:11.6.1).
  # Images using :latest or other floating tags are silently skipped.
  - package-ecosystem: "docker"
    directory: "/traefik"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/prometheus"
    schedule:
      interval: "weekly"

